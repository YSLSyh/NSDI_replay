[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replay"
version = "0.1.0"
description = "Image-only KDC reproduction for Cityscapes segmentation and ImageNet classification"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=4.51,<5",
  "huggingface-hub>=0.34,<1",
  "safetensors>=0.4",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6",
  "opencv-python-headless>=4.9",
  "matplotlib>=3.8",
  "faiss-cpu>=1.8",
  "tqdm>=4.66",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]
imagenet = ["pyarrow>=18,<24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
